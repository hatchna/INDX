#####################################################################
#  Example PRINT_START for INDX + OrcaSlicer
#####################################################################
#
#  CREDIT / ATTRIBUTION:
#  Author / Source: Charlie Mayall (charliemayall)
#  Repository: https://github.com/charliemayall/INDX
#  Original Concept: Multi-stage start routine with any-tool homing flow,
#                    soft-heating before G28 Z, and KAMP Smart Park integration.
#
#  Modifications by Nathan Hatch (hatchna):
#  - Added Nevermore filter and enclosure Caselight controls
#  - Integrated Klipper adaptive bed meshing (BED_MESH_CALIBRATE ADAPTIVE=1)
#    and adaptive LINE_PURGE.
#  - Z is homed, tilted and meshed on T0 with the bed at print temperature;
#    the print tool is picked up after the mesh.
#
#  Include from printer.cfg:
#    [include print_start.cfg]
#
#  Orca start G-code (example):
#    PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] \
#                EXTRUDER_TEMP={first_layer_temperature[initial_tool]} \
#                TOOL=[initial_tool]
#
#  Requires KAMP Smart_Park.cfg. Height is set via _KAMP_Settings
#  (stock SMART_PARK has no Z= param).
#
#  Sequence notes:
#  - G28 Z always taps with T0 (the homing override fetches it). Per-tool
#    Z offsets are stored relative to T0, so T0 defines the origin.
#  - The bed is at its target temperature before the tilt, the tap that
#    sets Z=0, and the mesh. Reaching target does not mean the bed and
#    frame have stopped moving; add a soak if first layers vary.
#  - The tap that counts is the G28 Z after SAFE_Z_TILT_ADJUST, with T0 at
#    WAIT_TEMP. The tilt moves the bed, so the provisional tap before it
#    does not hold.
#  - Set [bed_mesh] zero_reference_position in printer.cfg to the G28 Z
#    tap point (centre of travel: X150 Y144.5 on this machine). Without it
#    the mesh adds Beacon's own height error at the tap point to the
#    nozzle, which varies with plate coating and temperature.
#  - The print tool is picked up with its heater off, parked over the bed
#    with SMART_PARK, then heated there.
#####################################################################

# Two-phase Z tilt: coarse at high lift (safe when bed is far out), then
# fine at low lift. Overrides any SAFE_Z_TILT_ADJUST in utilities.cfg when
# this file is included after it.
[gcode_macro SAFE_Z_TILT_ADJUST]
description: Coarse Z_TILT at Z=8 to <=1mm, then fine at Z=2 to <=0.05mm
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    RESPOND MSG="Bed Mesh cleared by SAFE_Z_TILT_ADJUST"

    # Phase 1: high travel - get roughly level before flying low
    RESPOND MSG="SAFE_Z_TILT: coarse pass HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1 RETRIES=5
    # Phase 2: low travel - both commands are emitted up front (Jinja
    # evaluates once); the fine pass runs after the coarse pass finishes.
    RESPOND MSG="SAFE_Z_TILT: fine pass HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05 RETRIES=5



    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

# Mesh with Beacon unless a probe is named. The load cell is the default
# probe (INDX needs it for G28 Z, so [beacon] has register_as_probe: false),
# and Beacon's BED_MESH_CALIBRATE hands any mesh aimed at the default probe
# to stock bed_mesh, which then taps every point with the load cell.
# PROBE_METHOD=contact or PROBE=<name> still picks another probe.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Bed mesh with Beacon proximity scanning unless PROBE or PROBE_METHOD is given
gcode:
    {% if "PROBE" in params or "PROBE_METHOD" in params %}
        _BED_MESH_CALIBRATE_BASE {rawparams}
    {% else %}
        _BED_MESH_CALIBRATE_BASE PROBE_METHOD=proximity {rawparams}
    {% endif %}

[gcode_macro PRINT_START]
description: Home on T0, heat the bed, tilt, tap and mesh hot, then pick up the print tool, park, heat and purge
gcode:
    {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
        {action_raise_error("PRINT_START needs BED_TEMP and EXTRUDER_TEMP")}
    {% endif %}
    {% set bed_temp = params.BED_TEMP|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set wait_temp = params.WAIT_TEMP|default(150)|float %}
    {% set tool_count = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% if tool < 0 or tool >= tool_count %}
        {action_raise_error("PRINT_START: TOOL=%d is not configured (T0-T%d)" % (tool, tool_count - 1))}
    {% endif %}

    # Increase enclosure lighting during the print.
    SET_PIN PIN=caselight VALUE=0.75
    # Turn on the Nevermore filter early to clean chamber air during heat-up
    SET_PIN PIN=nevermore VALUE=1

    M140 S{bed_temp}

    # Same starting state on every print, restart or not
    BED_MESH_CLEAR

    # Full home. The homing override fetches T0 if it is not on the head.
    # This first Z tap is provisional: it only gives the tilt a safe reference.
    G28

    ###Clear GLOBAL_Z_OFFSET###
    RESET_GLOBAL_Z

    # Heat T0 and the bed together. T0 is on the head after G28, so
    # M104/M109 heat it.
    M104 S{wait_temp}
    M190 S{bed_temp}
    M109 S{wait_temp}

    SAFE_Z_TILT_ADJUST

    # The tap that counts: T0, at wait_temp, on a hot bed, after the tilt.
    # [bed_mesh] zero_reference_position must be this tap point.
    G28 Z

    # --- BED MESH SEQUENCE ---
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Pick up the print tool with its heater off. Without TEMP=, CHANGE_TOOL
    # uses the current target, and a target of 0 makes the pickup skip its
    # heat-and-wait (which would otherwise raise to min_extrude_temp + 10 at
    # the dock). T0 needs no swap, so it keeps its heat.
    {% if tool != 0 %}
        M104 S0
    {% endif %}
    CHANGE_TOOL TOOL={tool}

    # KAMP SMART_PARK reads smart_park_height; Z= is ignored
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=smart_park_height VALUE=5.0
    SMART_PARK

    # Heat to print temperature over the bed, then purge with the print tool
    M109 S{extruder_temp}
    LINE_PURGE
