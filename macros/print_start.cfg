#####################################################################
#  Example PRINT_START for INDX + OrcaSlicer
#####################################################################
#
#  CREDIT / ATTRIBUTION:
#  Author / Source: Charlie Mayall (charliemayall)
#  Repository: https://github.com/charliemayall/INDX
#  Original Concept: Multi-stage start routine with any-tool homing flow,
#                    soft-heating before G28 Z, and KAMP Smart Park integration.
#
#  Modifications by Nathan Hatch (hatchna):
#  - Added Nevermore filter and enclosure Caselight controls
#  - Integrated Klipper adaptive bed meshing (BED_MESH_CALIBRATE ADAPTIVE=1)
#    and adaptive LINE_PURGE.
#
#  Include from printer.cfg:
#    [include print_start.cfg]
#
#  Orca start G-code (example):
#    PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] \
#                EXTRUDER_TEMP={first_layer_temperature[initial_tool]} \
#                TOOL=[initial_tool]
#
#  Requires KAMP Smart_Park.cfg. Height is set via _KAMP_Settings
#  (stock SMART_PARK has no Z= param).
#
#  Sequence notes:
#  - Pick the print's initial TOOL before G28 Z so Z homes with that
#    nozzle (any-tool Z home). CAL_Z offsets stay T0-relative.
#  - Soft-heat (WAIT_TEMP) before first G28 Z / tilt.
#####################################################################

# Two-phase Z tilt: coarse at high lift (safe when bed is far out), then
# fine at low lift. Overrides any SAFE_Z_TILT_ADJUST in utilities.cfg when
# this file is included after it.
[gcode_macro SAFE_Z_TILT_ADJUST]
description: Coarse Z_TILT at Z=8 to <=1mm, then fine at Z=2 to <=0.05mm
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    RESPOND MSG="Bed Mesh cleared by SAFE_Z_TILT_ADJUST"
    
    # Phase 1: high travel - get roughly level before flying low
    RESPOND MSG="SAFE_Z_TILT: coarse pass HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1 RETRIES=5
    # Phase 2: low travel - both commands are emitted up front (Jinja
    # evaluates once); the fine pass runs after the coarse pass finishes.
    RESPOND MSG="SAFE_Z_TILT: fine pass HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05 RETRIES=5
    
    
    
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro PRINT_START]
description: Nevermore on, home Y/X, pick initial tool for Z, tilt, mesh, SMART_PARK, heat
gcode:
    {% set bed_temp = params.BED_TEMP|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set wait_temp = params.WAIT_TEMP|default(150)|float %}

    # Increase enclosure lighting during the print. 
    SET_PIN PIN=caselight VALUE=0.75
    # Turn on the Nevermore filter early to clean chamber air during heat-up
    SET_PIN PIN=nevermore VALUE=1

    M140 S{bed_temp}

    G28 Y
    G28 X

    G1 X150 Y150 F6000

    # Fake-home Z so CHANGE_TOOL can Z-hop; real soft G28 Z comes after heat.
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
    CHANGE_TOOL TOOL={tool}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0

    M104 S{wait_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_temp - 3} MAXIMUM={wait_temp + 3}
    
    ###Clear GLOBAL_Z_OFFSET###
    RESET_GLOBAL_Z
    
    G28 Z
    SAFE_Z_TILT_ADJUST

    # --- BED MESH SEQUENCE ---                                  # Clear old saved bed mesh (if any)
    BED_MESH_CALIBRATE ADAPTIVE=1                      # Run adaptive mesh

    # KAMP SMART_PARK reads smart_park_height; Z= is ignored
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=smart_park_height VALUE=5.0
    SMART_PARK

    M190 S{bed_temp}
    M104 S{extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 3} MAXIMUM={extruder_temp + 3}
    LINE_PURGE