#####################################################################
#  CANCEL_PRINT - Print Cancellation Routine
#####################################################################
#
#  CREDIT / ATTRIBUTION:
#  Author / Source: Nathan Hatch (hatchna)
#  Repository: https://github.com/hatchna/INDX
#  Description: Customized print cancellation routine turning off heaters,
#               parking toolhead at the rear, lowering the bed, clearing
#               mesh, and controlling caselight/Nevermore accessories.
#
#####################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE

    # PARK_TOOL  ## TEMPORARILY DISABLED: Debating if wanted.

    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X150 Y290 F3600                       ; park nozzle at rear
    G0 Z285                                  ; lower bed to povide better access to build sheet
    M107                                     ; turn off fan
    
    SET_PIN PIN=caselight VALUE=0.20
    BED_MESH_CLEAR
    SET_PIN PIN=nevermore VALUE=0